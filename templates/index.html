<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 1.5rem; padding: 1rem; background: #e9ecef; border-radius: 4px; text-align: center; font-size: 1.25rem; font-weight: bold; }
        .error { margin-top: 1rem; color: #dc3545; text-align: center; }
        .footer { margin-top: 2rem; text-align: center; font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Performance Prediction</h1>
        <form method="POST">
            <div class="form-group">
                <label for="attendance">Attendance (%)</label>
                <input type="number" step="0.1" id="attendance" name="attendance" required>
            </div>
            <div class="form-group">
                <label for="study_hours">Study Hours (per week)</label>
                <input type="number" step="0.1" id="study_hours" name="study_hours" required>
            </div>
            <div class="form-group">
                <label for="internal_marks">Internal Marks (out of 100)</label>
                <input type="number" step="0.1" id="internal_marks" name="internal_marks" required>
            </div>
            <div class="form-group">
                <label for="assignments">Assignments Completed</label>
                <input type="number" id="assignments" name="assignments" required>
            </div>
            <button type="submit">Predict Score</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if prediction is not none %}
            <div class="result">
                Predicted Final Marks: {{ prediction }}
            </div>
        {% endif %}
        
        <div class="footer">
            Model: Linear Regression
        </div>
    </div>
</body>
</html>
